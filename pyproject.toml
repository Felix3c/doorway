[project]
name = "doorway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "festgehalten @ git+https://github.com/Felix3c/festgehalten@f848d8089500edaf82bb82f290ef9d7061a62ddd"]

[project.scripts]
doorway = "doorway.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
